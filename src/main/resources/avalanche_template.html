<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Avalanche Reports</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f5f7fa;
          margin: 0;
          padding: 20px;
        }

        h1 {
          text-align: center;
        }

        .container {
          max-width: 900px;
          margin: auto;
          background: white;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
          position: relative; /* important for positioning inner absolute elements */
        }

        #navigation {
          text-align: center;
          margin-top: 10px;
        }

        #navigation button {
          margin: 0 10px;
          padding: 8px 16px;
          font-size: 14px;
        }

        #chartContainer {
          position: relative;
        }

        #missingReports:not([hidden]) {
          margin: 12px 0;
          padding: 10px;
          background: #f2f2f2;
          border-left: 4px solid #888;
          color: #444;
        }

        #loadingIndicator:not([hidden]) {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          background: rgba(255, 255, 255, 0.8);
        }

        .spinner {
          width: 24px;
          height: 24px;
          border: 3px solid #d6e5f2;
          border-top-color: #0077cc;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
          .spinner { animation: none; }
        }

        #commentBox {
          margin-top: 20px;
          padding: 15px;
          border-left: 4px solid #0077cc;
          background: #f0f6ff;
          display: none;
        }

        #commentBox h3 {
          margin-top: 0;
        }

        #currentDate {
          position: absolute;
          top: 10px;
          right: 10px;
          font-size: 16px;
          z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Avalanche Danger Levels</h1>

    <div id="currentDate"></div>

    <div id="chartContainer" aria-busy="false">
        <canvas id="avalancheChart"></canvas>
        <div id="loadingIndicator" role="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span>Loading reports...</span>
        </div>
    </div>

    <div id="missingReports" role="status" hidden></div>

    <div id="navigation">
        <button id="prevPage" disabled>Previous</button>
        <button id="nextPage" disabled>Next</button>
    </div>

    <!-- Inside your comment box container, e.g., in avalanche_template.html -->
    <div id="commentBox" style="display:none; position: relative;">
        <button id="closeComment" style="
            position: absolute;
            top: 5px;
            right: 5px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;">&times;
        </button>
        <div id="fullReport" style="margin-bottom: 7px;"></div>
        <div id="commentDate" style="margin-bottom: 7px;"></div>
        <div id="commentText" style="margin-bottom: 7px;"></div>
        <div id="commentMeta"></div>
    </div>
</div>

<script>
    const FULL_REPORT_URL = "pdfs/{day}";
    const API_URL = "reports";
    let currentPage = 0;
    const pageSize = 20; // default size

    let currentChartInstance = null; // To keep track of the Chart instance

    function updateButtons() {
      const prevBtn = document.getElementById('prevPage');
      const nextBtn = document.getElementById('nextPage');

      // Next is disabled if we are at the most current page (currentPage === 0)
      nextBtn.disabled = (currentPage === 0);

      // Previous is disabled only if we reached the oldest page (if you know totalPagesBack)
      // For now, assume it's always enabled
      prevBtn.disabled = false;
    }

    function formatDate(dateString) {
      const d = new Date(dateString);
      return d.toISOString().substring(0, 10);
    }

    function getColorByLevel(level) {
      if (level <= 1) return "green";
      if (level == 2) return "yellow";
      if (level == 3) return "orange";
      if (level >= 4) return "red";
      return "gray"; // fallback
    }

    function withMissingDays(reports, olderReport) {
      const entries = [];
      let previousDate = olderReport ? formatDate(olderReport.reportExpirationDate) : null;

      for (const report of reports) {
        const date = formatDate(report.reportExpirationDate);
        if (previousDate) {
          const nextDate = new Date(previousDate + "T00:00:00Z");
          nextDate.setUTCDate(nextDate.getUTCDate() + 1);
          while (nextDate.toISOString().substring(0, 10) < date) {
            entries.push({ date: nextDate.toISOString().substring(0, 10), report: null });
            nextDate.setUTCDate(nextDate.getUTCDate() + 1);
          }
        }
        entries.push({ date, report });
        previousDate = date;
      }
      return entries;
    }

    async function loadReports(page = 0) {
      const loadingIndicator = document.getElementById('loadingIndicator');
      const chartContainer = document.getElementById('chartContainer');
      loadingIndicator.hidden = false;
      chartContainer.setAttribute('aria-busy', 'true');
      document.getElementById('prevPage').disabled = true;
      document.getElementById('nextPage').disabled = true;

      try {
        const response = await fetch(`${API_URL}?size=${pageSize}&page=${page}`);
        if (!response.ok) throw new Error("Failed to fetch reports");
        const data = await response.json();

        // sort by date ascending
        data.sort((a, b) => new Date(a.reportExpirationDate) - new Date(b.reportExpirationDate));

        let olderReport = null;
        if (data.length > 0) {
          const olderResponse = await fetch(`${API_URL}?size=1&page=${(page + 1) * pageSize}`);
          if (!olderResponse.ok) throw new Error("Failed to fetch adjacent report");
          const olderReports = await olderResponse.json();
          olderReport = olderReports[0];
        }

        // store globally for access in click handler
        window.currentReports = data;

        // Destroy previous chart if exists
        if (currentChartInstance) {
          currentChartInstance.destroy();
        }

        // create chart with new data
        createChart(withMissingDays(data, olderReport));

        // update current page
        currentPage = page;
      } catch (err) {
        console.error(err);
        alert("Failed to load avalanche reports");
      } finally {
        loadingIndicator.hidden = true;
        chartContainer.setAttribute('aria-busy', 'false');
        updateButtons();
      }
    }

    function createChart(entries) {
      const labels = entries.map(entry => entry.date);
      const levels = entries.map(entry => entry.report ? entry.report.avalancheLevel : null);
      const barColors = levels.map(level => level === null ? "transparent" : getColorByLevel(level));
      const missingDates = entries.filter(entry => !entry.report).map(entry => entry.date);
      const missingReports = document.getElementById("missingReports");
      missingReports.hidden = missingDates.length === 0;
      missingReports.textContent = missingDates.length ? "Missing reports: " + missingDates.join(", ") : "";

      const ctx = document.getElementById("avalancheChart").getContext("2d");

      currentChartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Avalanche Level",
            data: levels,
            backgroundColor: barColors
          }]
        },
        plugins: [{
          id: "missingReports",
          afterDatasetsDraw: chart => {
            const { ctx, chartArea, scales } = chart;
            const width = Math.min(24, scales.x.width / entries.length * 0.7);
            entries.forEach((entry, index) => {
              if (entry.report) return;
              const x = scales.x.getPixelForValue(index);
              ctx.save();
              ctx.fillStyle = "rgba(128, 128, 128, 0.12)";
              ctx.fillRect(x - width / 2, chartArea.top, width, chartArea.bottom - chartArea.top);
              ctx.restore();
            });
          }
        }],
        options: {
          responsive: true,
          scales: {
            y: {
              min: 0,
              max: 5,
              ticks: {
                stepSize: 1
              },
              title: {
                display: true,
                text: "Danger Level"
              }
            }
          },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              if (entries[index].report) showComment(entries[index].report);
            }
          }
        }
      });
    }

    function showComment(report) {
      const commentBox = document.getElementById("commentBox");
      const closeBtn = document.getElementById("closeComment");
      const fullReportDiv = document.getElementById("fullReport");

      // Show comment box
      commentBox.style.display = "block";

      // Populate content
      document.getElementById("commentDate").textContent =
        "Report for " + formatDate(report.reportExpirationDate);
      document.getElementById("commentText").textContent = report.comment;
      document.getElementById("commentMeta").textContent =
        `Reported by ${report.reportedBy}, at ${report.reportDate}, valid until ${report.reportExpirationDate}`;

      // Generate report URL with formatted date
      const reportDateStr = formatDate(report.reportExpirationDate);
      const reportUrl = FULL_REPORT_URL.replace("{day}", reportDateStr);

      // Create link element
      fullReportDiv.innerHTML = `<a href="${reportUrl}" target="_blank">PDF Report</a>`;

      // Add event listener for close button
      closeBtn.onclick = function() {
        commentBox.style.display = "none";
      };
    }

    // Button event handlers
    document.getElementById('prevPage').addEventListener('click', () => {
      commentBox.style.display = "none";
      loadReports(currentPage + 1); // older data
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      commentBox.style.display = "none";
      loadReports(currentPage - 1); // newer data
    });

    // Assuming this is within the script tags in your HTML or a linked JS file
    function displayCurrentDate() {
      const dateElement = document.getElementById("currentDate");
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const currentDate = new Date().toLocaleDateString(undefined, options);
      dateElement.textContent = currentDate;
    }

    // Initialize
    window.onload = () => {
      displayCurrentDate();
      loadReports(0);
    };
</script>

</body>
</html>
